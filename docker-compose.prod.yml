services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: improvement-backend
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SERVER_PORT: ${SERVER_PORT:-8081}
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Improvement Solutions}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom}"
    ports:
      - "${BACKEND_PORT:-8082}:8081"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - autoheal=true
    networks:
      proxy-network:
        aliases:
          - improvement-backend
      app-net:
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: improvement-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8001}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - proxy-network
      - app-net

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: improvement-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 90
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

volumes:
  backend-uploads:
  backend-logs:

networks:
  proxy-network:
    external: true
  app-net:
    driver: bridge
