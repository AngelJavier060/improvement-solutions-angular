

server {
    listen 80;
    server_name localhost improvement-solution.com www.improvement-solution.com;

    # Aumentar límite de carga para archivos (20 MB)
    client_max_body_size 20m;

    # Cabeceras de seguridad para mejorar reputación y evitar ataques
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Desactivar redirect absoluto para que Nginx preserve host:port del cliente
    absolute_redirect off;

    # Redirigir raíz exacta a /en-US/
    location = / {
        return 301 /en-US/;
    }

    # Servir la app Angular desde /en-US/
    location ^~ /en-US/ {
        try_files $uri $uri/ /en-US/index.html;
    }

    # Cualquier otra ruta no /api/ redirige a /en-US/
    location / {
        return 301 /en-US$request_uri;
    }

    # Proxy API: nombre único del contenedor + DNS Docker fresco.
    # Un 502/504 de conexión se reintenta una vez (el backend puede estar reiniciando).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream improvement-backend:8081;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_socket_keepalive on;
        proxy_intercept_errors off;
        error_page 502 504 = @api_retry;
    }

    location @api_retry {
        internal;
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $api_upstream improvement-backend:8081;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 @backend_down;
    }

    # Archivos estáticos con cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache para index.html (evita referencias a chunks antiguos)
    location = /en-US/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires 0;
    }

    # Si el backend cae, no enmascarar 502 con 404 (50x.html se borra en el Dockerfile).
    error_page 502 503 504 =503 @backend_down;
    location @backend_down {
        default_type application/json;
        add_header Retry-After 10 always;
        return 503 '{"message":"El servidor se está recuperando. Espere unos segundos e intente de nuevo.","code":"API_UNAVAILABLE","status":503}';
    }

    # Configuración de logs
    access_log /var/log/nginx/improvement-solutions_access.log;
    error_log /var/log/nginx/improvement-solutions_error.log;

    # Configuración de compresión
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
