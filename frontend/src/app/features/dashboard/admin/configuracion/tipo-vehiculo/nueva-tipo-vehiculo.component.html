<div class="config-form-container">
  <div class="config-form-header">
    <button class="btn-back" (click)="goBack()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h2>Nuevo Tipo de Vehículo</h2>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="config-form">
    <div class="form-section">
      <h3 class="section-title">
        <i class="fas fa-truck me-2"></i>
        Información del Tipo de Vehículo
      </h3>

      <div class="form-group">
        <label for="name">Nombre del Tipo de Vehículo *</label>
        <input id="name" type="text" formControlName="name" class="form-control"
               placeholder="Ej: Camión, Trailer, Camioneta, etc."
               [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched">
        <span class="invalid-feedback" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          El nombre es requerido
        </span>
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" formControlName="description" class="form-control" rows="3"
                  placeholder="Descripción opcional del tipo de vehículo"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="goBack()">
        <i class="fas fa-times me-2"></i>Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
        <i class="fas fa-save me-2"></i>
        <span *ngIf="loading">Guardando...</span>
        <span *ngIf="!loading">Guardar Tipo de Vehículo</span>
      </button>
    </div>
  </form>
</div>
