<div class="epp-catalog-container">
  <div class="header">
    <div class="title-section">
      <h2>{{ titulo }}</h2>
      <p>{{ subtitulo }}</p>
    </div>
    <div class="actions">
      <button type="button" class="btn-secondary" [routerLink]="listaUrl()">
        <i class="fas fa-arrow-left"></i> Volver a Lista
      </button>
    </div>
  </div>

  <div class="card">
    <div *ngIf="loading" class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      <span>Cargando proveedor...</span>
    </div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div *ngIf="successMessage" class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        <span>{{ successMessage }}</span>
      </div>

      <div *ngIf="error" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>

      <div class="form-group">
        <label for="prov-name">Nombre <span class="required">*</span></label>
        <input type="text" id="prov-name" formControlName="name"
               [class.is-invalid]="form.get('name')?.invalid && (form.get('name')?.touched || formSubmitted)"
               placeholder="Nombre del proveedor"/>
        <div *ngIf="form.get('name')?.invalid && (form.get('name')?.touched || formSubmitted)" class="error-message">
          <span *ngIf="form.get('name')?.errors?.['required']">El nombre es obligatorio</span>
          <span *ngIf="form.get('name')?.errors?.['maxlength']">Máximo 200 caracteres</span>
        </div>
      </div>

      <div class="form-group">
        <label for="prov-ruc">RUC</label>
        <input type="text" id="prov-ruc" formControlName="ruc" maxlength="20" placeholder="RUC del proveedor"/>
      </div>

      <div class="form-group">
        <label for="prov-phone">Teléfono</label>
        <input type="text" id="prov-phone" formControlName="phone" maxlength="50" placeholder="Teléfono"/>
      </div>

      <div class="form-group">
        <label for="prov-email">Email</label>
        <input type="email" id="prov-email" formControlName="email"
               [class.is-invalid]="form.get('email')?.invalid && (form.get('email')?.touched || formSubmitted)"
               placeholder="correo@ejemplo.com"/>
        <div *ngIf="form.get('email')?.invalid && (form.get('email')?.touched || formSubmitted)" class="error-message">
          <span *ngIf="form.get('email')?.errors?.['email']">Email no válido</span>
        </div>
      </div>

      <div class="form-group">
        <label for="prov-address">Dirección</label>
        <textarea id="prov-address" formControlName="address" rows="2" maxlength="255"
                  placeholder="Dirección del proveedor"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancelar()" [disabled]="submitting">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button type="submit" class="btn-primary" [disabled]="submitting">
          <i *ngIf="submitting" class="fas fa-spinner fa-spin"></i>
          <i *ngIf="!submitting" class="fas fa-save"></i>
          {{ submitting ? 'Guardando...' : (modoEdicion ? 'Actualizar' : 'Guardar') }}
        </button>
      </div>
    </form>
  </div>
</div>
