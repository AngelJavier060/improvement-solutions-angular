<div class="talento-humano-container" [class.th-theme-dark]="isDark">
  <div class="d-flex layout-row">

    <!-- Toggle button -->
    <button class="sidebar-toggle btn btn-light shadow-sm"
            [class.collapsed]="isCollapsed"
            type="button"
            (click)="toggleSidebar()">
      <i class="fas" [ngClass]="isCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
    </button>

    <!-- ── Sidebar ── -->
    <aside class="sidebar-talento shadow-lg" [class.collapsed]="isCollapsed">

      <!-- Cabecera -->
      <div class="sidebar-header pt-4 pb-2">
        <div class="sidebar-icon mb-2">
          <span class="material-symbols-outlined filled">group</span>
        </div>
        <h4 class="sidebar-title" *ngIf="!isCollapsed">Talento Humano</h4>
      </div>

      <!-- Empresa activa (solo informativo, sin colapso) -->
      <div class="sidebar-business-info" *ngIf="!isCollapsed">
        <span class="biz-name">{{ businessName }}</span>
      </div>

      <!-- Navegación principal -->
      <nav class="sidebar-nav mt-2">
        <ul>

          <!-- Inicio -->
          <li>
            <a routerLink="inicio"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               class="nav-link"
               title="Inicio">
              <span class="material-symbols-outlined">home</span>
              <span class="nav-label" *ngIf="!isCollapsed">Inicio</span>
            </a>
          </li>

          <!-- Gestión de Empleados -->
          <li>
            <a routerLink="gestion-empleados"
               routerLinkActive="active"
               class="nav-link"
               title="Gestión de Empleados">
              <span class="material-symbols-outlined">group</span>
              <span class="nav-label" *ngIf="!isCollapsed">Gestión de Empleados</span>
            </a>
          </li>

          <!-- Documentos y Certificaciones -->
          <li>
            <a href="javascript:void(0)"
               (click)="openDocumentosCertificaciones($event)"
               class="nav-link"
               [class.active]="isDocumentosCertificacionesActive()"
               title="Documentos y Certificaciones">
              <span class="material-symbols-outlined">description</span>
              <span class="nav-label" *ngIf="!isCollapsed">Documentos y Certificaciones</span>
            </a>
          </li>

          <!-- ── Control de Asistencia (con submenú) ── -->
          <li class="nav-group" [class.open]="isAttendanceExpanded">

            <!-- Cabecera del grupo -->
            <button class="nav-link nav-group-toggle w-100 text-start"
                    (click)="toggleAttendance()"
                    title="Control de Asistencia"
                    type="button">
              <span class="material-symbols-outlined">calendar_today</span>
              <span class="nav-label" *ngIf="!isCollapsed">Control de Asistencia</span>
              <span *ngIf="!isCollapsed"
                    class="material-symbols-outlined nav-chevron ms-auto">{{ isAttendanceExpanded ? 'expand_less' : 'expand_more' }}</span>
            </button>

            <!-- Sub-items -->
            <ul class="nav-submenu" *ngIf="isAttendanceExpanded && !isCollapsed">
              <li>
                <a routerLink="planilla-mensual"
                   routerLinkActive="active"
                   class="nav-link nav-sublink"
                   title="Planilla Mensual">
                  <i class="fas fa-table"></i>
                  <span>Planilla Mensual</span>
                </a>
              </li>
              <li>
                <a routerLink="horas-extra"
                   routerLinkActive="active"
                   class="nav-link nav-sublink"
                   title="Horas Extras">
                  <i class="fas fa-clock"></i>
                  <span>Horas Extras</span>
                </a>
              </li>
              <li>
                <a routerLink="vacaciones"
                   routerLinkActive="active"
                   class="nav-link nav-sublink"
                   title="Vacaciones Anuales">
                  <i class="fas fa-umbrella-beach"></i>
                  <span>Vacaciones Anuales</span>
                </a>
              </li>
              <li>
                <a routerLink="permisos"
                   routerLinkActive="active"
                   class="nav-link nav-sublink"
                   title="Permisos">
                  <i class="fas fa-file-signature"></i>
                  <span>Permisos</span>
                </a>
              </li>
              <li>
                <a routerLink="accidentes"
                   routerLinkActive="active"
                   class="nav-link nav-sublink"
                   title="Accidentes">
                  <i class="fas fa-exclamation-triangle"></i>
                  <span>Accidentes</span>
                </a>
              </li>
            </ul>
          </li>

        </ul>
      </nav>

      <div class="sidebar-theme">
        <button type="button"
                class="th-theme-toggle"
                (click)="toggleTheme()"
                [attr.title]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
                [attr.aria-label]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
                [attr.aria-pressed]="isDark">
          <span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
          <span class="nav-label" *ngIf="!isCollapsed">{{ isDark ? 'Modo claro' : 'Modo oscuro' }}</span>
        </button>
      </div>
    </aside>

    <!-- ── Contenido principal ── -->
    <div class="flex-grow-1 d-flex flex-column content-col"
         [class.full]="isCollapsed"
         [style.margin-left.px]="isCollapsed ? 64 : 260"
         [style.width]="isCollapsed ? 'calc(100% - 64px)' : 'calc(100% - 260px)'">
      <div class="module-content flex-grow-1">
        <router-outlet></router-outlet>
      </div>
    </div>

  </div>
</div>
