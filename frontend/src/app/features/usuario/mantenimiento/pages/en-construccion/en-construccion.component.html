<div class="mc-page">
  <div class="mc-card">
    <div class="mc-card__icon">
      <i class="fas fa-hard-hat"></i>
    </div>
    <p class="mc-card__eyebrow">Módulo de flota</p>
    <h1 class="mc-card__title">{{ sectionTitle }}</h1>
    <p class="mc-card__lead">Página en construcción</p>
    <p class="mc-card__text">{{ sectionDescription }}</p>
    <div class="mc-card__actions">
      <button type="button" class="mc-btn mc-btn--primary" (click)="goFlota()">
        <i class="fas fa-truck"></i>
        Ir a Flota
      </button>
      <button type="button" class="mc-btn mc-btn--ghost" (click)="goDashboard()">
        <i class="fas fa-tachometer-alt"></i>
        Ir al Dashboard
      </button>
    </div>
  </div>
</div>
